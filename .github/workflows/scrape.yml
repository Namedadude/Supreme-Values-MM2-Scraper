name: Scrape Supreme Values

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # manual button in Actions tab
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: node scrape.js

      - name: Commit & push values.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/values.json public/index.html
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update values.json $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
