name: Scrape Supreme Values

on:
  schedule:
    # Runs every 4 hours (at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/scrape.js"
      - "scraper/package.json"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "scraper/package-lock.json"

      - name: Install dependencies
        working-directory: scraper
        run: npm ci

      - name: Run Scraper
        working-directory: scraper
        run: node scrape.js

      - name: Commit and push updated values.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "scraper/values.json"
          if git diff --staged --quiet; then
            echo "No changes in values.json"
          else
            git commit -m "chore: auto-update values.json [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
