name: Scrape Supreme Values Beta

on:
  schedule:
    # Runs every 4 hours (at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper beta/scrape_beta.js"
      - "scraper beta/package.json"
      - ".github/workflows/scrape_beta.yml"

permissions:
  contents: write

jobs:
  scrape-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "scraper beta/package-lock.json"

      - name: Install dependencies
        working-directory: "scraper beta"
        run: npm ci

      - name: Run Beta Scraper
        working-directory: "scraper beta"
        run: node scrape_beta.js

      - name: Commit and push updated values_beta.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "scraper beta/values_beta.json"
          if [ -f "public/values_beta.json" ]; then
            git add "public/values_beta.json"
          fi
          if git diff --staged --quiet; then
            echo "No changes in values_beta.json"
          else
            git commit -m "chore(beta): auto-update values_beta.json [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
